
name: Aircraft Acquisition Test

on:
  workflow_dispatch:

jobs:
  aircraft:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Acquire aircraft every 60 seconds
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone

          url = (
              "https://opendata.adsb.fi/api/v3/"
              "lat/45.5/lon/10.8/dist/100"
          )

          for i in range(3):
              print("Acquisition", i + 1, flush=True)

              try:
                  req = urllib.request.Request(
                      url,
                      headers={"Accept": "application/json"}
                  )

                  with urllib.request.urlopen(
                      req, timeout=20
                  ) as response:
                      data = json.load(response)

                  aircraft = data.get("ac", [])

                  print(
                      "UTC:",
                      datetime.now(timezone.utc).isoformat(),
                      flush=True
                  )

                  print(
                      "AIRCRAFT_COUNT:",
                      len(aircraft),
                      flush=True
                  )

                  print(
                      "STATUS: OK",
                      flush=True
                  )

              except Exception as e:
                  print("ERROR:", str(e), flush=True)

              if i < 2:
                  time.sleep(60)
          PY


name: Aircraft CURL Verification

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify adsb.fi with CURL
        shell: bash
        run: |
          set -euo pipefail

          URL="https://opendata.adsb.fi/api/v3/lat/45.5/lon/10.8/dist/100"

          echo "Testing aircraft API with curl"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 20 \
            --output /tmp/aircraft.json \
            --write-out "%{http_code}" \
            "$URL")

          echo "HTTP_STATUS=$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Provider refused the request"
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("/tmp/aircraft.json") as f:
              data = json.load(f)

          aircraft = data.get("ac")

          if not isinstance(aircraft, list):
              raise ValueError("Invalid aircraft JSON")

          print("JSON_VALID=True")
          print("AIRCRAFT_COUNT=", len(aircraft))
          print("STATUS=OK")
          PY
